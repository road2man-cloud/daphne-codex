<script>
const DATA={early:{title:'2·3구역 · 옛 비도 B2F/B3F',floors:{2:{name:'2구역 · B2F',z:1,color:'#356d92'},3:{name:'3구역 · B3F',z:0,color:'#66538e'}},nodes:[['e2',2,0,7,'2구역 진입','start','1구역에서 내려온 지점'],['red',2,2,7,'RED 구간','room','첫 낙하까지 진행'],['pit1',2,4,6,'낙하 ①','pit','B3F 같은 위치로 낙하'],['land1',3,4,6,'착지 ①','land','낙하 착지'],['st1',3,2,4,'복귀 계단 ①','stairs','B2F로 복귀'],['orange',2,2,4,'ORANGE 구간','room','레버 방향 진행'],['pit2',2,5,3,'낙하 ②','pit','레버 구역으로 낙하'],['lever',3,5,3,'레버','lever','BLUE 경로 개방'],['st2',3,7,2,'복귀 계단 ②','stairs','B2F로 복귀'],['blue',2,7,2,'BLUE 구간','room','레버 개방 후 진행'],['green',2,9,4,'GREEN 구간','room','최종 낙하 방향'],['finalPit',2,10,6,'최종 낙하','pit','네크로코어 구역으로 낙하'],['boss',3,10,6,'네크로코어','boss','보스'],['h3',3,9,8,'3구역 하켄','harken','보스 뒤 하켄·4구역']],edges:[['e2','red','walk'],['red','pit1','walk'],['pit1','land1','drop',1],['land1','st1','walk'],['st1','orange','stairs'],['orange','pit2','walk'],['pit2','lever','drop',1],['lever','st2','walk'],['st2','blue','stairs'],['blue','green','walk'],['green','finalPit','walk'],['finalPit','boss','drop',1],['boss','h3','walk']],default:['e2','h3'],canon:'B2F의 숨은 구멍으로 B3F에 떨어지고 계단으로 B2F에 복귀하는 과정을 반복합니다. 진행 색 순서는 RED → ORANGE → BLUE → GREEN이며 ORANGE 끝의 레버가 BLUE 진행을 엽니다. 마지막 낙하 뒤 B3F의 네크로코어를 지나 하켄으로 이어집니다.'},late:{title:'8·9·10구역 · 성채 1F/2F/3F',floors:{8:{name:'8구역 · 성채 1F',z:0,color:'#347a70'},9:{name:'9구역 · 성채 2F',z:1,color:'#6b5794'},10:{name:'10구역 · 성채 3F',z:2,color:'#9a5d61'}},nodes:[['e8',8,0,8,'8구역 시작','start','7구역에서 진입'],['a8',8,2,6,'8F 전반','room','첫 상행 방향'],['up89a',8,4,5,'8→9 계단 ①','stairs','9구역으로'],['a9',9,4,5,'9F 전반','room','10구역 방향'],['trap9',9,6,4,'9F 함정방','room','배치에 따라 위치 변형'],['up910a',9,8,3,'9→10 계단 ①','stairs','10구역 전반으로'],['a10',10,8,3,'10F 전반','room','상단 중앙방 방향'],['drop10',10,10,2,'10→9 낙하','pit','9구역 하켄 바로 밖으로'],['h9',9,10,2,'9구역 하켄','harken','첫 보급점'],['drop9',9,9,5,'9→8 낙하','pit','후반 루트 시작'],['b8',8,9,5,'8F 후반','room','낙하 착지'],['up89b',8,7,7,'8→9 계단 ②','stairs','9구역 후반 복귀'],['b9',9,7,7,'9F 후반','room','최종 10구역 방향'],['up910b',9,5,8,'9→10 계단 ②','stairs','최종 상행'],['spring',10,5,8,'생명의 샘','spring','보스 전 회복'],['final10',10,3,6,'10F 최종 통로','room','영주의 방 방향'],['boss10',10,1,4,'개문장치·보스','boss','최종 진행'],['warp',10,7,9,'하켄 복귀 워프','warp','9구역 하켄으로 복귀']],edges:[['e8','a8','walk'],['a8','up89a','walk'],['up89a','a9','stairs'],['a9','trap9','walk'],['trap9','up910a','walk'],['up910a','a10','stairs'],['a10','drop10','walk'],['drop10','h9','drop',1],['h9','drop9','walk'],['drop9','b8','drop',1],['b8','up89b','walk'],['up89b','b9','stairs'],['b9','up910b','walk'],['up910b','spring','stairs'],['spring','final10','walk'],['final10','boss10','walk'],['spring','warp','walk'],['warp','h9','warp',1]],default:['e8','boss10'],canon:'1회차 전반은 단순한 8→9가 아니라 8 → 9 → 10까지 올라간 뒤 10구역 상단 중앙방의 구멍으로 9구역 하켄 앞에 떨어집니다. 후반은 9 → 8 → 9 → 10으로 다시 올라가며, 10구역에는 최종방 전 생명의 샘이 있습니다. 9구역 일부 함정방은 맵 생성에 따라 위치가 달라질 수 있어 이 화면은 세부 벽 배치가 아니라 변형에도 유지되는 연결 위상을 우선 표시합니다.'}};
let mode='early',A=null,B=null,path=[],scale=1,tx=0,ty=0,floorGap=175,visible=new Set();const S=document.getElementById('map'),W=document.getElementById('world'),NS='http://www.w3.org/2000/svg';const $=q=>document.querySelector(q),el=(tag,a={})=>{const x=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(a))x.setAttribute(k,v);return x};const G=()=>DATA[mode],nodes=()=>new Map(G().nodes.map(n=>[n[0],n])),floor=z=>G().floors[z],proj=n=>[650+(n[2]-n[3])*48,390+(n[2]+n[3])*24-floor(n[1]).z*floorGap];
function planePts(ns,z){let xs=ns.map(n=>n[2]),ys=ns.map(n=>n[3]),x0=Math.min(...xs)-1.4,x1=Math.max(...xs)+1.4,y0=Math.min(...ys)-1.4,y1=Math.max(...ys)+1.4;return[[x0,y0],[x1,y0],[x1,y1],[x0,y1]].map(([x,y])=>{let p=proj(['',z,x,y]);return p.join(',')}).join(' ')}function diamond(p,s=19){return`${p[0]},${p[1]-s} ${p[0]+s*1.8},${p[1]} ${p[0]},${p[1]+s} ${p[0]-s*1.8},${p[1]}`}function curve(a,b){let p=proj(a),q=proj(b),vert=a[1]!=b[1];return vert?`M${p[0]} ${p[1]} C${p[0]} ${p[1]-45},${q[0]} ${q[1]+45},${q[0]} ${q[1]}`:`M${p[0]} ${p[1]} L${q[0]} ${q[1]}`}
function adj(){let m=nodes(),a=new Map(G().nodes.map(n=>[n[0],[]]));for(const e of G().edges){a.get(e[0]).push([e[1],e]);if(!e[3])a.get(e[1]).push([e[0],e])}return a}function bfs(s,t){let a=adj(),q=[s],seen=new Set([s]),prev=new Map;while(q.length){let u=q.shift();if(u===t)break;for(const[v,e]of a.get(u)||[])if(!seen.has(v)){seen.add(v);prev.set(v,[u,e]);q.push(v)}}if(!seen.has(t))return[];let out=[],u=t;while(u!==s){let [p,e]=prev.get(u);out.push([p,u,e]);u=p}return out.reverse()}function full(){[A,B]=G().default;path=bfs(A,B);render()}
function render(){W.innerHTML='';let g=G(),m=nodes(),pathIds=new Set(path.flatMap(x=>[x[0],x[1]]));for(const[z,f]of Object.entries(g.floors)){if(!visible.has(+z))continue;let ns=g.nodes.filter(n=>n[1]==z),poly=el('polygon',{points:planePts(ns,+z),class:'plane',fill:f.color+'22'});W.append(poly);let b=ns.reduce((o,n)=>({minx:Math.min(o.minx,n[2]),maxx:Math.max(o.maxx,n[2]),miny:Math.min(o.miny,n[3]),maxy:Math.max(o.maxy,n[3])}),{minx:99,maxx:-99,miny:99,maxy:-99});for(let x=Math.floor(b.minx)-1;x<=Math.ceil(b.maxx)+1;x++){let p=proj(['',+z,x,b.miny-1]),q=proj(['',+z,x,b.maxy+1]);W.append(el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:'grid'}))}for(let y=Math.floor(b.miny)-1;y<=Math.ceil(b.maxy)+1;y++){let p=proj(['',+z,b.minx-1,y]),q=proj(['',+z,b.maxx+1,y]);W.append(el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:'grid'}))}let p=proj(['',+z,b.minx-1,b.miny-1]);let t=el('text',{x:p[0],y:p[1]-18,class:'floorName'});t.textContent=f.name;W.append(t)}
for(const e of g.edges){let a=m.get(e[0]),b=m.get(e[1]);if(!visible.has(a[1])||!visible.has(b[1]))continue;let d=curve(a,b),vert=a[1]!=b[1];if(!vert){W.append(el('path',{d,class:'ribbonBase'}));W.append(el('path',{d,class:'ribbon',stroke:floor(a[1]).color}))}else{let c=e[2]=='drop'?'#ff7474':e[2]=='warp'?'#c792ff':'#55d6ff';let p=el('path',{d,class:'vertical',stroke:c});if(e[2]=='drop')p.setAttribute('marker-end','url(#arrRed)');W.append(p)}}if(path.length){let d=path.map((x,i)=>{let a=m.get(x[0]),b=m.get(x[1]),p=proj(a),q=proj(b);return(i?'L':'M')+p[0]+' '+p[1]+' L'+q[0]+' '+q[1]}).join(' '),r=el('path',{d,class:'route','marker-end':'url(#arrGold)'});W.append(r);let dot=el('circle',{r:6,fill:'#fff',filter:'url(#glow)'}),am=el('animateMotion',{dur:Math.max(3,path.length*.55)+'s',repeatCount:'indefinite',path:d});dot.append(am);W.append(dot)}
for(const n of g.nodes){if(!visible.has(n[1]))continue;let p=proj(n),grp=el('g',{class:'room'+(n[0]===A?' selA':'')+(n[0]===B?' selB':'')+(pathIds.has(n[0])?' path':'')});let fill=n[4].includes('낙하')?'#10131b':n[5]=='boss'?'#7f3037':n[5]=='harken'?'#315a87':n[5]=='spring'?'#247060':floor(n[1]).color;grp.append(el('polygon',{points:diamond(p,n[5]=='boss'?25:20),fill}));if(n[5]=='pit'||n[5]=='drop')grp.append(el('circle',{cx:p[0],cy:p[1],r:8,class:'pit'}));let ic={'stairs':'↕','lever':'◆','boss':'⚔','harken':'✦','spring':'✚','warp':'◎'}[n[5]];if(ic){let it=el('text',{x:p[0]-5,y:p[1]+5,class:'icon'});it.textContent=ic;grp.append(it)}grp.onclick=e=>{e.stopPropagation();select(n[0])};W.append(grp);let t=el('text',{x:p[0]+25,y:p[1]-12,class:'label'});t.textContent=n[4];W.append(t)}W.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);updateSide()}
function select(id){if(!A||B){A=id;B=null;path=[]}else if(A===id){A=B=null;path=[]}else{B=id;path=bfs(A,B)}render()}function updateSide(){let g=G(),m=nodes(),s=$('#status'),r=$('#route');if(A&&B){s.innerHTML=`<strong>${m.get(A)[4]}</strong> → <strong>${m.get(B)[4]}</strong>`;r.innerHTML=path.length?'<ol class="steps">'+[A,...path.map(x=>x[1])].map(id=>`<li>${m.get(id)[4]} <small>(${m.get(id)[1]}구역)</small></li>`).join('')+'</ol>':'연결 가능한 경로가 없습니다.'}else if(A){s.innerHTML=`출발: <strong>${m.get(A)[4]}</strong> · 도착 지점을 클릭하세요.`;r.innerHTML=''}else{s.textContent='전체 진행 경로를 표시합니다.';r.innerHTML=''}$('#canon').textContent=g.canon}
function floorButtons(){let box=$('#floors');box.innerHTML='';visible=new Set(Object.keys(G().floors).map(Number));for(const[z,f]of Object.entries(G().floors)){let b=document.createElement('button');b.className='floorToggle';b.textContent=f.name;b.onclick=()=>{let k=+z;visible.has(k)?visible.delete(k):visible.add(k);b.classList.toggle('off',!visible.has(k));render()};box.append(b)}}function resetMode(n){mode=n;floorButtons();A=B=null;path=[];full();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.g===n));$('#height').value=floorGap;tx=ty=0;scale=.92;render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>resetMode(b.dataset.g));$('#full').onclick=full;$('#clear').onclick=()=>{A=B=null;path=[];render()};$('#height').oninput=e=>{floorGap=+e.target.value;render()};$('#zin').onclick=()=>{scale=Math.min(2.2,scale*1.12);render()};$('#zout').onclick=()=>{scale=Math.max(.45,scale/1.12);render()};$('#fit').onclick=()=>{scale=.92;tx=ty=0;render()};let drag=false,lx=0,ly=0,moved=false;S.onpointerdown=e=>{drag=true;moved=false;lx=e.clientX;ly=e.clientY;S.setPointerCapture(e.pointerId);S.classList.add('drag')};S.onpointermove=e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;tx+=dx/scale;ty+=dy/scale;lx=e.clientX;ly=e.clientY;render()};S.onpointerup=e=>{drag=false;S.classList.remove('drag')};S.onwheel=e=>{e.preventDefault();scale=Math.max(.45,Math.min(2.2,scale*(e.deltaY<0?1.08:.92)));render()};resetMode(new URLSearchParams(location.search).get('g')==='late'?'late':'early');
